<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Your login code</title>
  </head>
  <body style="margin:0;padding:24px;background:#0b1020;font-family:ui-sans-serif,system-ui,sans-serif;color:#f4f7ff;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center">
          <table role="presentation" width="420" cellspacing="0" cellpadding="0" style="background:#151c2e;border:1px solid #2c3a5a;border-radius:20px;padding:28px;">
            <tr>
              <td>
                <p style="margin:0 0 8px;color:#9aa8c7;font-size:13px;">Test Auth</p>
                <h1 style="margin:0 0 12px;font-size:22px;">Your verification code</h1>
                <p style="margin:0 0 20px;color:#9aa8c7;line-height:1.5;">
                  Enter this 6-digit code in the app. It expires in {{ minutes }} minutes.
                </p>
                <p style="margin:0;letter-spacing:0.35em;font-size:28px;font-weight:700;background:#1d2740;border-radius:12px;padding:16px;text-align:center;">
                  {{ code }}
                </p>
                <p style="margin:20px 0 0;color:#9aa8c7;font-size:12px;">
                  If you did not request this code, you can ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
